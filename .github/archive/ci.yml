name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Run only one focused verification boundary
        required: true
        default: all
        type: choice
        options:
          - all
          - rust
          - platform
          - client
          - native
          - headless

# Cancel an in-flight run if the branch is pushed again
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforces invariants that are currently only stated in prose.
  # Cheap, and it runs from the very first commit.
  repo-invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # full history — the trailer check scans every commit

      - name: CLAUDE.md and AGENTS.md must stay identical
        run: |
          # They differ only in line 3, which names the other file.
          if ! diff <(tail -n +4 CLAUDE.md) <(tail -n +4 AGENTS.md); then
            echo "::error::CLAUDE.md and AGENTS.md have drifted. Both agents must read the same rules."
            exit 1
          fi
          echo "OK — agent instructions are in sync"

      - name: Controlled document set must be present
        run: |
          missing=0
          for f in MSC2-VISION.md msc2-product.md msc2-engineering.md \
                   msc2-decisions.md msc2-port-plan.md rolling-plan.md; do
            if [ ! -f "docs/msc2/$f" ]; then
              echo "::error::missing docs/msc2/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "OK — all six documents present"
          exit $missing

      - name: No AI attribution trailers in commit messages
        run: |
          # The local hook (.githooks/commit-msg) catches these at commit
          # time, but hooks are per-clone and can be missing. This is the
          # guarantee: such a commit cannot land on main.
          if git log --format='%B' | grep -inE '^[[:space:]]*(co-authored-by|generated with|🤖)'; then
            echo "::error::Commit message contains an AI attribution trailer. See .githooks/commit-msg"
            exit 1
          fi
          echo "OK — no attribution trailers in $(git rev-list --count HEAD) commits"

  # Build the shared frontend and headless agent once per platform. Jobs that
  # consume either artifact can be rerun without rebuilding unrelated checks.
  platform-build:
    name: Platform build (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'platform' || inputs.scope == 'client' || inputs.scope == 'native' || inputs.scope == 'headless' }}
    needs: repo-invariants
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary_name: msc
          - os: macos-latest
            platform: macos
            binary_name: msc
          - os: windows-latest
            platform: windows
            binary_name: msc.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: clients/desktop-web/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install shared client dependencies
        working-directory: clients/desktop-web
        run: npm ci

      - name: Build
        working-directory: clients/desktop-web
        run: npm run build

      - name: Verify frontend artifact identity
        working-directory: clients/desktop-web
        run: npm run bundle:identity

      - name: Build headless agent
        run: cargo build --workspace

      - name: Collect headless artifact
        shell: bash
        run: |
          dest="target/phase4-headless/${{ matrix.platform }}"
          mkdir -p "$dest"
          cp "target/debug/${{ matrix.binary_name }}" "$dest/${{ matrix.binary_name }}"

      - name: Upload headless artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: headless-${{ matrix.platform }}
          path: target/phase4-headless
          if-no-files-found: error

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-${{ matrix.platform }}
          path: clients/desktop-web/dist
          if-no-files-found: error

  rust-regression:
    name: Rust regression (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'rust' }}
    needs: repo-invariants
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Format check
        id: format_check
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings -A dead-code -A unused-mut -A clippy::needless-return -A clippy::collapsible-if -A clippy::derivable-impls -A clippy::useless-format
      - name: Workspace regression suite
        id: workspace_regression
        continue-on-error: true
        run: cargo nextest run --workspace --no-fail-fast --test-threads 1
      - name: Focused raw Bedrock import check
        id: bedrock_import
        continue-on-error: true
        run: cargo nextest run -p msc-agent raw_import_route_imports_bedrock_folder
      - name: Focused production Bedrock smoke
        id: bedrock_smoke
        continue-on-error: true
        run: cargo nextest run -p msc-agent --test bedrock_production_smoke
      - name: Report Rust verification failures
        if: always()
        shell: bash
        env:
          FORMAT_OUTCOME: ${{ steps.format_check.outcome }}
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
          REGRESSION_OUTCOME: ${{ steps.workspace_regression.outcome }}
          BEDROCK_IMPORT_OUTCOME: ${{ steps.bedrock_import.outcome }}
          BEDROCK_SMOKE_OUTCOME: ${{ steps.bedrock_smoke.outcome }}
        run: |
          failed=0
          for check in \
            "format:${FORMAT_OUTCOME}" \
            "clippy:${CLIPPY_OUTCOME}" \
            "workspace regression:${REGRESSION_OUTCOME}" \
            "raw Bedrock import:${BEDROCK_IMPORT_OUTCOME}" \
            "production Bedrock smoke:${BEDROCK_SMOKE_OUTCOME}"; do
            if [[ "${check#*:}" != "success" ]]; then
              echo "::error::Rust verification failed: ${check}"
              failed=1
            fi
          done
          exit "${failed}"
  platform-smokes:
    name: Platform smokes (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'platform' }}
    needs: platform-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary_name: msc
          - os: macos-latest
            platform: macos
            binary_name: msc
          - os: windows-latest
            platform: windows
            binary_name: msc.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Download headless agent artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: headless-${{ matrix.platform }}
          path: target/phase4-headless
      - name: Stage headless agent for platform smokes
        shell: bash
        run: |
          mkdir -p target/debug
          binary_path="$(find target/phase4-headless -type f -name '${{ matrix.binary_name }}' -print -quit)"
          test -n "$binary_path"
          cp "$binary_path" "target/debug/${{ matrix.binary_name }}"
          chmod +x "target/debug/${{ matrix.binary_name }}"
      - name: Phase 6 restart-sensitive public-path smoke
        id: phase6_smoke
        continue-on-error: true
        shell: bash
        run: tools/phase6/phase6-gate-smoke.sh --synthetic
      - name: Phase 7 provisioning and launch smoke
        id: phase7_smoke
        continue-on-error: true
        shell: bash
        run: tools/phase7/phase7-gate-smoke.sh --synthetic
      - name: Phase 8 add-on and modpack smoke
        id: phase8_smoke
        continue-on-error: true
        shell: bash
        run: tools/phase8/phase8-gate-smoke.sh --synthetic
      - name: Phase 9 networking and helper gate
        id: phase9_gate
        continue-on-error: true
        shell: bash
        run: python3 tools/phase9/phase9-check.py --gate
      - name: Phase 9 networking and helper smoke
        id: phase9_smoke
        continue-on-error: true
        shell: bash
        run: tools/phase9/phase9-smoke.sh --synthetic
      - name: Phase 10 Bedrock synthetic smoke
        id: phase10_smoke
        continue-on-error: true
        shell: bash
        run: bash tools/phase10/phase10-smoke.sh --synthetic
      - name: Phase 10 Bedrock production wiring check
        id: phase10_production
        continue-on-error: true
        shell: bash
        run: python3 tools/phase10/phase10-production-check.py --check
      - name: Phase 10 Bedrock compatibility check
        id: phase10_compatibility
        continue-on-error: true
        shell: bash
        run: python3 tools/phase10/compatibility-check.py docs/msc2/bedrock/compatibility-matrix.csv
      - name: Phase 10 Bedrock evidence checks
        id: phase10_evidence
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/phase10/evidence-check.py --distribution
          python3 tools/phase10/evidence-check.py --runtimes
      - name: Report platform smoke failures
        if: always()
        shell: bash
        env:
          PHASE6_OUTCOME: ${{ steps.phase6_smoke.outcome }}
          PHASE7_OUTCOME: ${{ steps.phase7_smoke.outcome }}
          PHASE8_OUTCOME: ${{ steps.phase8_smoke.outcome }}
          PHASE9_GATE_OUTCOME: ${{ steps.phase9_gate.outcome }}
          PHASE9_SMOKE_OUTCOME: ${{ steps.phase9_smoke.outcome }}
          PHASE10_SMOKE_OUTCOME: ${{ steps.phase10_smoke.outcome }}
          PHASE10_PRODUCTION_OUTCOME: ${{ steps.phase10_production.outcome }}
          PHASE10_COMPATIBILITY_OUTCOME: ${{ steps.phase10_compatibility.outcome }}
          PHASE10_EVIDENCE_OUTCOME: ${{ steps.phase10_evidence.outcome }}
        run: |
          failed=0
          for check in \
            "Phase 6:${PHASE6_OUTCOME}" \
            "Phase 7:${PHASE7_OUTCOME}" \
            "Phase 8:${PHASE8_OUTCOME}" \
            "Phase 9 gate:${PHASE9_GATE_OUTCOME}" \
            "Phase 9 smoke:${PHASE9_SMOKE_OUTCOME}" \
            "Phase 10 smoke:${PHASE10_SMOKE_OUTCOME}" \
            "Phase 10 production:${PHASE10_PRODUCTION_OUTCOME}" \
            "Phase 10 compatibility:${PHASE10_COMPATIBILITY_OUTCOME}" \
            "Phase 10 evidence:${PHASE10_EVIDENCE_OUTCOME}"; do
            if [[ "${check#*:}" != "success" ]]; then
              echo "::error::Platform verification failed: ${check}"
              failed=1
            fi
          done
          exit "${failed}"

  client-validation:
    name: Client validation (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'client' }}
    needs: platform-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: clients/desktop-web/package-lock.json
      - name: Install client dependencies
        working-directory: clients/desktop-web
        run: npm ci
      - name: Check generated API types
        id: api_check
        continue-on-error: true
        working-directory: clients/desktop-web
        run: npm run api:check
      - name: Download frontend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-${{ matrix.platform }}
          path: clients/desktop-web/dist
      - name: Format check
        id: client_format
        continue-on-error: true
        working-directory: clients/desktop-web
        run: npm run format:check
      - name: Type check
        id: client_typecheck
        continue-on-error: true
        working-directory: clients/desktop-web
        run: npm run check
      - name: Unit suite
        id: client_unit
        continue-on-error: true
        working-directory: clients/desktop-web
        run: npm run test:unit
      - name: Verify frontend artifact identity
        id: client_identity
        continue-on-error: true
        working-directory: clients/desktop-web
        run: npm run bundle:identity
      - name: Report client verification failures
        if: always()
        shell: bash
        env:
          API_OUTCOME: ${{ steps.api_check.outcome }}
          FORMAT_OUTCOME: ${{ steps.client_format.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.client_typecheck.outcome }}
          UNIT_OUTCOME: ${{ steps.client_unit.outcome }}
          IDENTITY_OUTCOME: ${{ steps.client_identity.outcome }}
        run: |
          failed=0
          for check in \
            "API types:${API_OUTCOME}" \
            "format:${FORMAT_OUTCOME}" \
            "type check:${TYPECHECK_OUTCOME}" \
            "unit suite:${UNIT_OUTCOME}" \
            "artifact identity:${IDENTITY_OUTCOME}"; do
            if [[ "${check#*:}" != "success" ]]; then
              echo "::error::Client verification failed: ${check}"
              failed=1
            fi
          done
          exit "${failed}"

  native-desktop:
    name: Native desktop (${{ matrix.os }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'native' }}
    needs: platform-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: clients/desktop-web/package-lock.json
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1
      - name: Install client dependencies
        working-directory: clients/desktop-web
        run: npm ci
      - name: Install Linux WebKitGTK desktop-test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            dbus-x11 \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            webkit2gtk-driver \
            wget \
            xvfb
          cargo install tauri-driver --version 2.0.6 --locked
      - name: Build real Tauri candidate (macOS and Windows)
        if: matrix.platform != 'linux'
        working-directory: clients/desktop-web
        run: npm exec tauri build -- --debug --no-bundle
      - name: Exercise the Linux WebKitGTK Tauri candidate
        if: matrix.platform == 'linux'
        shell: bash
        run: bash tools/phase11/linux-webkitgtk-smoke.sh --native
      - name: Record desktop and web runner evidence
        shell: bash
        run: |
          bash tools/phase11/desktop-web-smoke.sh \
            --record-platform "${{ matrix.platform }}" \
            "target/phase11-client-evidence/${{ matrix.platform }}.md"
      - name: Upload desktop and web runner evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-web-evidence-${{ matrix.platform }}
          path: target/phase11-client-evidence
          if-no-files-found: error

  headless-link:
    name: Headless no-GUI link check
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'headless' }}
    needs: platform-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download native headless artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: headless-*
          path: target/phase4-headless
          merge-multiple: true

      - name: Verify headless artifacts link no GUI frameworks
        run: python3 tools/phase4/headless-link-check.py --all-artifacts target/phase4-headless

      - name: Phase 10 Bedrock production wiring check
        run: python3 tools/phase10/phase10-production-check.py --check
