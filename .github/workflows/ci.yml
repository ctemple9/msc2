name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-flight run if the branch is pushed again
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforces invariants that are currently only stated in prose.
  # Cheap, and it runs from the very first commit.
  repo-invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — the trailer check scans every commit

      - name: CLAUDE.md and AGENTS.md must stay identical
        run: |
          # They differ only in line 3, which names the other file.
          if ! diff <(tail -n +4 CLAUDE.md) <(tail -n +4 AGENTS.md); then
            echo "::error::CLAUDE.md and AGENTS.md have drifted. Both agents must read the same rules."
            exit 1
          fi
          echo "OK — agent instructions are in sync"

      - name: Controlled document set must be present
        run: |
          missing=0
          for f in MSC2-VISION.md msc2-product.md msc2-engineering.md \
                   msc2-decisions.md msc2-port-plan.md rolling-plan.md; do
            if [ ! -f "docs/msc2/$f" ]; then
              echo "::error::missing docs/msc2/$f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "OK — all six documents present"
          exit $missing

      - name: No AI attribution trailers in commit messages
        run: |
          # The local hook (.githooks/commit-msg) catches these at commit
          # time, but hooks are per-clone and can be missing. This is the
          # guarantee: such a commit cannot land on main.
          if git log --format='%B' | grep -inE '^[[:space:]]*(co-authored-by|generated with|🤖)'; then
            echo "::error::Commit message contains an AI attribution trailer. See .githooks/commit-msg"
            exit 1
          fi
          echo "OK — no attribution trailers in $(git rev-list --count HEAD) commits"

  # Proves the three-platform matrix works before any code depends on it.
  # D-017: Windows validation starts with the substrate, not with the GUI.
  toolchain:
    name: Toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            binary_name: msc
          - os: macos-latest
            platform: macos
            binary_name: msc
          - os: windows-latest
            platform: windows
            binary_name: msc.exe
    steps:
      - uses: actions/checkout@v4

      # The browser and Tauri candidates are built from this one lockfile on
      # every native runner. The separate headless job below does not install
      # Node or link any GUI framework.
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop-web/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The Phase 6 restart-sensitive smoke (P6.25) compiles a small real
      # fake-Paper jar with javac/jar and runs it with java, on all three
      # platforms — pin a JDK explicitly rather than trust whatever a
      # runner image happens to have on PATH. Also backs the Phase 7
      # smoke below. 25, not 21: P7.31 wired MSC 2's own required-major
      # Java guard into real creation/start, and the real Vanilla catalog
      # this smoke resolves "latest" against now needs Java 25
      # (Minecraft's year-based version scheme, 26.x) — 21 would make the
      # guard correctly refuse every family's creation here. Cameron's
      # call, P7.31's own flagged question: match CI to what MSC 2
      # actually promises today rather than pin the smoke to an older
      # target.
      - name: Install JDK (Phase 6/7 smokes)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Report toolchain
        run: |
          rustc --version
          cargo --version

      - name: Install shared client dependencies
        working-directory: clients/desktop-web
        run: npm ci

      - name: Install browser test engines (Linux)
        if: matrix.platform == 'linux'
        working-directory: clients/desktop-web
        run: npx playwright install --with-deps chromium webkit

      - name: Install browser test engines (macOS and Windows)
        if: matrix.platform != 'linux'
        working-directory: clients/desktop-web
        run: npx playwright install chromium webkit

      # The Linux proof has to drive the real system renderer, rather than
      # silently treating Playwright's bundled WebKit as desktop evidence.
      - name: Install Linux WebKitGTK desktop-test dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            dbus-x11 \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-0 \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            webkit2gtk-driver \
            wget \
            xvfb
          cargo install tauri-driver --version 2.0.6 --locked

      - name: Build
        run: cargo build --workspace

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # The TUI is intentionally outside this beta's release boundary. Its
        # scaffold is still compiled by the all-targets check, but its
        # deferred dead-code and presentation-only lint noise must not block
        # the Tauri shell and headless agent release.
        run: cargo clippy --workspace --all-targets -- -D warnings -A dead-code -A unused-mut -A clippy::needless-return -A clippy::collapsible-if -A clippy::derivable-impls -A clippy::useless-format

      # P2.11 added crates/msc-api alongside msc-domain, so this is the
      # first step where the workspace has more than one crate's worth of
      # tests to run — cargo nextest run --workspace covers both.
      - name: Test
        run: cargo nextest run --workspace

      # P6.27: the same committed synthetic-world smoke (P6.25) on all
      # three platforms — no real MSC 1 data, no local absolute paths.
      # `shell: bash` runs it through Git Bash on the Windows runner, the
      # only leg that has never executed this script before.
      - name: Phase 6 restart-sensitive public-path smoke
        shell: bash
        run: tools/phase6/phase6-gate-smoke.sh --synthetic

      # P7.29: the six-family provisioning/launch smoke (P7.27) on all
      # three platforms, same `shell: bash` / Git Bash arrangement as the
      # Phase 6 smoke above. Windows is the leg that matters here per
      # D-017: a real Forge/NeoForge args-file launch, a real hard-kill
      # mid-install, and a Windows-built `msc.exe` all go through this
      # leg for the first time.
      - name: Phase 7 provisioning and launch smoke
        shell: bash
        run: tools/phase7/phase7-gate-smoke.sh --synthetic

      # P8.27: add-on/modpack public-path smoke. Like the Phase 6/7
      # scripts, run the committed Bash driver on Git Bash for Windows.
      - name: Phase 8 add-on and modpack smoke
        shell: bash
        run: tools/phase8/phase8-gate-smoke.sh --synthetic

      # P9.18: the Phase 9 gate and synthetic smoke are offline and use only
      # the committed fake transports, so they run on every toolchain leg.
      - name: Phase 9 networking and helper gate
        shell: bash
        run: python3 tools/phase9/phase9-check.py --gate

      - name: Phase 9 networking and helper smoke
        shell: bash
        run: tools/phase9/phase9-smoke.sh --synthetic

      # P10.26: all Bedrock checks are offline and use only committed fakes,
      # fixtures, and documentary evidence. Keep them on every toolchain leg
      # so the Phase 10 candidate proves the same contract on all platforms.
      - name: Phase 10 Bedrock synthetic smoke
        shell: bash
        run: bash tools/phase10/phase10-smoke.sh --synthetic

      - name: Phase 10 Bedrock production wiring check
        shell: bash
        run: python3 tools/phase10/phase10-production-check.py --check

      - name: Phase 10 Bedrock compatibility check
        shell: bash
        run: python3 tools/phase10/compatibility-check.py docs/msc2/bedrock/compatibility-matrix.csv

      - name: Phase 10 Bedrock evidence checks
        shell: bash
        run: |
          python3 tools/phase10/evidence-check.py --distribution
          python3 tools/phase10/evidence-check.py --runtimes

      - name: Validate the production shared client
        working-directory: clients/desktop-web
        run: npm run verify:scaffold

      # This exercises msc-agent's production fallback, not a second static
      # server, so the browser candidate cannot drift from the served bundle.
      - name: Agent-served browser bundle smoke
        run: cargo nextest run -p msc-agent --test web_ui

      - name: Browser core workflow smoke
        working-directory: clients/desktop-web
        run: npm run test:e2e-browser

      - name: Build real Tauri candidate (macOS and Windows)
        if: matrix.platform != 'linux'
        working-directory: clients/desktop-web
        run: npm exec tauri build -- --debug --no-bundle

      - name: Exercise the Linux WebKitGTK Tauri candidate
        if: matrix.platform == 'linux'
        shell: bash
        run: bash tools/phase11/linux-webkitgtk-smoke.sh --native

      - name: Record desktop and web runner evidence
        shell: bash
        run: |
          bash tools/phase11/desktop-web-smoke.sh \
            --record-platform "${{ matrix.platform }}" \
            "target/phase11-client-evidence/${{ matrix.platform }}.md"

      - name: Upload desktop and web runner evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-web-evidence-${{ matrix.platform }}
          path: target/phase11-client-evidence
          if-no-files-found: error

      - name: Collect headless artifact
        shell: bash
        run: |
          dest="target/phase4-headless/${{ matrix.platform }}"
          mkdir -p "$dest"
          cp "target/debug/${{ matrix.binary_name }}" "$dest/${{ matrix.binary_name }}"

      - name: Upload headless artifact
        uses: actions/upload-artifact@v4
        with:
          name: headless-${{ matrix.platform }}
          path: target/phase4-headless
          if-no-files-found: error

  headless-link:
    name: Headless no-GUI link check
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download native headless artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: headless-*
          path: target/phase4-headless
          merge-multiple: true

      - name: Verify headless artifacts link no GUI frameworks
        run: python3 tools/phase4/headless-link-check.py --all-artifacts target/phase4-headless

      - name: Phase 10 Bedrock production wiring check
        run: python3 tools/phase10/phase10-production-check.py --check
