name: Beta release candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease when the selected ref is an exact v* tag
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

concurrency:
  group: beta-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      MSC2_RELEASE_PUBLIC_KEY_HEX: ${{ vars.MSC2_RELEASE_PUBLIC_KEY_HEX }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x86_64
            os: macos-15-intel
            toolchain: 1.97.1
            rust-target: x86_64-apple-darwin
            tauri-bundles: dmg
            installer-extension: dmg
          - platform: macos-aarch64
            os: macos-14
            toolchain: 1.97.1
            rust-target: aarch64-apple-darwin
            tauri-bundles: dmg
            installer-extension: dmg
          - platform: windows-x86_64
            os: windows-latest
            toolchain: 1.97.1
            rust-target: x86_64-pc-windows-msvc
            tauri-bundles: msi
            installer-extension: msi
          - platform: linux-x86_64
            os: ubuntu-22.04
            toolchain: 1.97.1
            rust-target: x86_64-unknown-linux-gnu
            tauri-bundles: deb,rpm

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate release and update gate
        run: |
          python3 tools/release/check-release-workflow.py .github/workflows/release.yml --expect-publish-guard
          python3 tools/release/check-update-gate.py

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: clients/desktop-web/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.rust-target }}
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            cpio \
            binutils

      - name: Install shared client dependencies
        working-directory: clients/desktop-web
        run: npm ci

      - name: Build the desktop frontend
        working-directory: clients/desktop-web
        run: |
          npm run build
          npm run bundle:identity

      - name: Resolve and validate release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          agent_version="$(awk -F'"' '/^[[:space:]]*version[[:space:]]*=/ { print $2; exit }' crates/msc-agent/Cargo.toml)"
          package_version="$(node -p "require('./clients/desktop-web/package.json').version")"
          tauri_version="$(node -p "require('./clients/desktop-web/src-tauri/tauri.conf.json').version")"
          shell_version="$(awk -F'"' '/^[[:space:]]*version[[:space:]]*=/ { print $2; exit }' clients/desktop-web/src-tauri/Cargo.toml)"
          bundle_version="$(sed -n "s/^[[:space:]]*version: '\([^']*\)',$/\1/p" clients/desktop-web/src/lib/bundle-identity.ts | head -n 1)"
          test -n "$agent_version"
          test "$agent_version" = "$package_version"
          test "$agent_version" = "$tauri_version"
          test "$agent_version" = "$shell_version"
          test "$agent_version" = "$bundle_version"
          test "${#MSC2_RELEASE_PUBLIC_KEY_HEX}" -eq 64
          [[ "$MSC2_RELEASE_PUBLIC_KEY_HEX" =~ ^[0-9A-Fa-f]{64}$ ]]

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${agent_version}" || {
              echo "tag ${GITHUB_REF_NAME} does not match source version v${agent_version}" >&2
              exit 1
            }
          fi

          echo "RELEASE_VERSION=$agent_version" >> "$GITHUB_ENV"
          echo "release version: $agent_version"

      - name: Run targeted client checks
        working-directory: clients/desktop-web
        run: |
          npm run api:check
          npm run check
          npm run test:contract
          npm run test:auth-desktop
          npm run test:tauri-boundary
          npm run test:fedora-regressions

      - name: Run targeted agent checks
        run: |
          cargo fmt --all -- --check
          cargo --locked clippy -p msc-agent --bin msc --target "${{ matrix.rust-target }}" -- -D warnings -A dead-code -A unused-mut -A clippy::needless-return -A clippy::collapsible-if -A clippy::derivable-impls -A clippy::useless-format
      - name: Run Linux Fedora regression tests
        if: matrix.platform == 'linux-x86_64'
        run: |
          cargo --locked test -p msc-agent --bin msc routes::components::staged_upload_tests::chunked_modpack_upload_requires_order_and_completes_with_verified_size -- --exact
          cargo --locked test -p msc-agent --bin msc routes::components::staged_upload_tests::world_import_chunks_can_be_cancelled_and_removed_idempotently -- --exact
          cargo --locked test -p msc-agent --bin msc cli::update::tests::authorized_update_waits_for_authorizer_and_reports_cancellation -- --exact

      - name: Build release agent and CLI
        run: cargo --locked build --release --target "${{ matrix.rust-target }}" -p msc-agent

      - name: Stage the matching Tauri agent payload
        if: matrix.platform != 'windows-x86_64'
        working-directory: clients/desktop-web
        run: npm run prepare:agent:release

      - name: Stage the matching Tauri agent payload on Windows
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: ./tools/release/stage-windows-agent.ps1 -WorkspaceRoot $env:GITHUB_WORKSPACE -TargetTriple "${{ matrix.rust-target }}"

      - name: Prepare the Windows bundle icon
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: python tools/release/prepare-windows-icon.py $env:GITHUB_WORKSPACE

      - name: Build unsigned Tauri installer
        if: matrix.platform != 'windows-x86_64'
        working-directory: clients/desktop-web
        run: npm exec tauri build -- --bundles "${{ matrix.tauri-bundles }}" --no-sign --config '{"build":{"beforeBuildCommand":""}}'

      - name: Build unsigned Tauri installer on Windows
        if: matrix.platform == 'windows-x86_64'
        working-directory: clients/desktop-web
        shell: pwsh
        run: |
          npm exec tauri build -- --bundles "${{ matrix.tauri-bundles }}" --no-sign --config '{"build":{"beforeBuildCommand":""},"bundle":{"icon":["icons/icon.ico"]}}'

      - name: Package Linux headless artifact
        if: matrix.platform == 'linux-x86_64'
        run: bash tools/release/build-linux-headless.sh target/release-artifacts

      - name: Package macOS headless artifact
        if: startsWith(matrix.platform, 'macos-')
        run: bash tools/release/build-macos-headless.sh target/release-artifacts "${{ matrix.rust-target }}" "${{ matrix.platform }}"

      - name: Package Windows headless artifact
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: ./tools/release/build-windows-headless.ps1 target/release-artifacts

      - name: Collect platform-labeled Tauri installer
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p target/release-artifacts
          if [[ "${{ matrix.platform }}" == "linux-x86_64" ]]; then
            for installer_extension in deb rpm; do
              bundle_dir="clients/desktop-web/src-tauri/target/release/bundle/$installer_extension"
              installer="$(find "$bundle_dir" -maxdepth 1 -type f -name "*.$installer_extension" -print -quit)"
              test -n "$installer" || { echo "no Tauri installer found in $bundle_dir" >&2; exit 1; }
              cp "$installer" "target/release-artifacts/msc2-${RELEASE_VERSION}-${{ matrix.platform }}.$installer_extension"
            done
          else
            bundle_dir="clients/desktop-web/src-tauri/target/release/bundle/${{ matrix.installer-extension }}"
            installer="$(find "$bundle_dir" -maxdepth 1 -type f -name "*.${{ matrix.installer-extension }}" -print -quit)"
            test -n "$installer" || { echo "no Tauri installer found in $bundle_dir" >&2; exit 1; }
            cp "$installer" "target/release-artifacts/msc2-${RELEASE_VERSION}-${{ matrix.platform }}.${{ matrix.installer-extension }}"
          fi

      - name: Record Linux artifact glibc requirements and headless links
        if: matrix.platform == 'linux-x86_64'
        run: |
          python3 tools/release/check-linux-artifacts.py \
            --headless-archive "target/release-artifacts/msc2-headless-${RELEASE_VERSION}-linux-x86_64.tar.gz" \
            --desktop-deb "target/release-artifacts/msc2-${RELEASE_VERSION}-linux-x86_64.deb" \
            --desktop-rpm "target/release-artifacts/msc2-${RELEASE_VERSION}-linux-x86_64.rpm" \
            --max-glibc 2.36 \
            --report target/release-artifacts/linux-abi-report.json

      - name: Install and launch exact Linux artifacts on Debian 12
        if: matrix.platform == 'linux-x86_64'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/target/release-artifacts:/artifacts:ro" \
            -e RELEASE_VERSION="$RELEASE_VERSION" \
            debian:12-slim bash -euc '
              apt-get update
              apt-get install --yes "/artifacts/msc2-${RELEASE_VERSION}-linux-x86_64.deb"
              agent="$(find /usr/lib -type f -path "*/agent/msc" -print -quit)"
              test -n "$agent"
              "$agent" --help >/dev/null
              mkdir -p /opt/msc2-headless /usr/local/bin
              tar -xzf "/artifacts/msc2-headless-${RELEASE_VERSION}-linux-x86_64.tar.gz" -C /opt/msc2-headless
              install -m 0755 /opt/msc2-headless/msc /usr/local/bin/msc
              msc --help >/dev/null
            '

      - name: Install and launch exact Linux artifacts on Fedora 44
        if: matrix.platform == 'linux-x86_64'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/target/release-artifacts:/artifacts:ro" \
            -e RELEASE_VERSION="$RELEASE_VERSION" \
            fedora:44 bash -euc '
              dnf install --assumeyes "/artifacts/msc2-${RELEASE_VERSION}-linux-x86_64.rpm"
              agent="$(find /usr/lib -type f -path "*/agent/msc" -print -quit)"
              test -n "$agent"
              "$agent" --help >/dev/null
              mkdir -p /opt/msc2-headless /usr/local/bin
              tar -xzf "/artifacts/msc2-headless-${RELEASE_VERSION}-linux-x86_64.tar.gz" -C /opt/msc2-headless
              install -m 0755 /opt/msc2-headless/msc /usr/local/bin/msc
              msc --help >/dev/null
            '

      - name: Record unsigned beta evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > target/release-artifacts/UNSIGNED-BETA-NOTICE.txt <<EOF
          MSC 2 beta candidate ${RELEASE_VERSION}
          Platform: ${{ matrix.platform }}

          This candidate has no release code signing, notarization, or publisher
          identity. The Tauri build used --no-sign. Any macOS ad-hoc signature
          on the Bedrock sidecar only satisfies Virtualization.framework's
          entitlement requirement; it is not Developer ID signing or notarization.
          Obtain this candidate from the intended release source and verify its
          checksum before opening or installing it.
          EOF

      - name: Record release builder environment
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - target/release-artifacts/BUILD-ENVIRONMENT.json <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          def version(*command):
              return subprocess.check_output(command, text=True).strip()

          record = {
              "schemaVersion": 1,
              "sourceCommit": os.environ["GITHUB_SHA"],
              "platform": os.environ["RELEASE_PLATFORM"],
              "runner": {
                  "imageOS": os.environ.get("ImageOS", "unknown"),
                  "imageVersion": os.environ.get("ImageVersion", "unknown"),
              },
              "toolchain": {
                  "rustc": version("rustc", "--version"),
                  "cargo": version("cargo", "--version"),
                  "node": version("node", "--version"),
                  "npm": version("npm", "--version"),
                  "cargoNextest": version("cargo", "nextest", "--version").split()[1],
              },
          }
          Path(sys.argv[1]).write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload platform-labeled beta artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beta-${{ matrix.platform }}-${{ env.RELEASE_VERSION }}
          path: target/release-artifacts
          if-no-files-found: error

  ci-evidence:
    name: Require same-commit full CI
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.require-ci.outputs.run_id }}
      run_attempt: ${{ steps.require-ci.outputs.run_attempt }}
      html_url: ${{ steps.require-ci.outputs.html_url }}
      head_sha: ${{ steps.require-ci.outputs.head_sha }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Wait for successful full CI on this tag commit
        id: require-ci
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/release/require-ci-run.py --output "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ github.ref_name }}
    if: >-
      needs.build.result == 'success' &&
      needs.ci-evidence.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v') &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish == true)
      )
    needs: [build, ci-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install provenance toolchains
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.97.1

      - name: Download successful platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: beta-*
          path: target/release-downloads
          merge-multiple: false

      - name: Assemble release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p target/release-assets
          asset_count=0
          while IFS= read -r -d '' source; do
            filename="$(basename "$source")"
            destination="target/release-assets/$filename"
            test ! -e "$destination" || {
              echo "duplicate release asset: $filename" >&2
              exit 1
            }
            cp "$source" "$destination"
            asset_count=$((asset_count + 1))
          done < <(
            find target/release-downloads -type f \( \
              -name '*.dmg' -o \
              -name '*.msi' -o \
              -name '*.deb' -o \
              -name '*.rpm' -o \
              -name '*.tar.gz' -o \
              -name '*.zip' \
            \) -print0
          )
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          assets = Path("target/release-assets")
          sources = sorted(Path("target/release-downloads").rglob("BUILD-ENVIRONMENT.json"))
          if len(sources) != 4:
              raise SystemExit(f"expected four release builder records, found {len(sources)}")
          for source in sources:
              record = json.loads(source.read_text(encoding="utf-8"))
              platform = record.get("platform")
              if not isinstance(platform, str) or not platform:
                  raise SystemExit(f"missing platform in {source}")
              destination = assets / f"BUILD-ENVIRONMENT-{platform}.json"
              if destination.exists():
                  raise SystemExit(f"duplicate release builder record: {platform}")
              shutil.copyfile(source, destination)
          PY
          test "$asset_count" -eq 9 || {
            echo "expected nine desktop/headless release assets, found $asset_count" >&2
            exit 1
          }

      - name: Record same-commit CI and release run IDs
        env:
          CI_RUN_ID: ${{ needs.ci-evidence.outputs.run_id }}
          CI_RUN_ATTEMPT: ${{ needs.ci-evidence.outputs.run_attempt }}
          CI_RUN_URL: ${{ needs.ci-evidence.outputs.html_url }}
          CI_RUN_SHA: ${{ needs.ci-evidence.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          test "$CI_RUN_SHA" = "$GITHUB_SHA"
          python3 - "$CI_RUN_ID" "$CI_RUN_ATTEMPT" "$CI_RUN_URL" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          evidence = {
              "source_commit": os.environ["GITHUB_SHA"],
              "release_tag": os.environ["GITHUB_REF_NAME"],
              "release_workflow": {
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              },
              "ci_workflow": {
                  "run_id": int(sys.argv[1]),
                  "run_attempt": int(sys.argv[2]),
                  "url": sys.argv[3],
                  "head_sha": os.environ["GITHUB_SHA"],
              },
          }
          Path("target/release-assets/CI-EVIDENCE.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Generate and verify SHA-256 manifest
        run: |
          python3 tools/release/verify-artifact-manifest.py \
            --manifest target/release-assets/SHA256SUMS \
            --artifacts target/release-assets \
            --write

      - name: Prepare release notes
        shell: bash
        run: |
          set -Eeuo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          cat > target/release-assets/RELEASE-NOTES.md <<EOF
          # MSC 2 ${GITHUB_REF_NAME}

          This prerelease contains Intel and Apple Silicon macOS installers and
          headless archives plus x86_64 Windows and Linux artifacts. Verify the
          checksum file before use. The Apple Silicon macOS artifacts contain
          no Bedrock VM sidecar; local Bedrock requires an Intel Mac.

          Each standalone headless archive includes HEADLESS-INSTALL.md. It
          defines the tri-platform msc/msc.exe command-install contract and
          keeps PATH installation separate from local service registration.

          This release includes the signed manifest and detached Ed25519
          signature required for native in-app installation.
          Same-commit CI and release workflow run IDs are attached in
          CI-EVIDENCE.json.
          Release ID: ${release_version}
          EOF

      - name: Publish signed update metadata when configured
        shell: bash
        env:
          MSC2_RELEASE_SIGNING_KEY_HEX: ${{ secrets.MSC2_RELEASE_SIGNING_KEY_HEX }}
          MSC2_RELEASE_PUBLIC_KEY_HEX: ${{ vars.MSC2_RELEASE_PUBLIC_KEY_HEX }}
        run: |
          set -Eeuo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          manifest="target/release-assets/msc2-update-manifest.json"
          signature="target/release-assets/msc2-update-manifest.sig"
          python3 -c 'import json; json.load(open("packaging/update-release-schema.json", encoding="utf-8"))'

          test -n "${MSC2_RELEASE_SIGNING_KEY_HEX:-}" || {
            echo "MSC2_RELEASE_SIGNING_KEY_HEX must be configured before publishing updates" >&2
            exit 1
          }
          test "${#MSC2_RELEASE_PUBLIC_KEY_HEX}" -eq 64
          [[ "$MSC2_RELEASE_PUBLIC_KEY_HEX" =~ ^[0-9A-Fa-f]{64}$ ]]
          python3 tools/release/sign-update-manifest.py \
            --artifacts target/release-assets \
            --release-id "$release_version" \
            --tag "$GITHUB_REF_NAME" \
            --api-major 1 \
            --api-min-minor 0 \
            --api-max-minor 0 \
            --private-key-env MSC2_RELEASE_SIGNING_KEY_HEX \
            --public-key-env MSC2_RELEASE_PUBLIC_KEY_HEX \
            --manifest "$manifest" \
            --signature "$signature"
          test -s "$manifest"
          test -s "$signature"
          echo "signed update metadata prepared"

      - name: Generate and verify dependency inventory and provenance
        run: |
          python3 tools/release/check-provenance.py \
            --manifest target/release-assets/msc2-update-manifest.json \
            --write
          python3 tools/release/check-provenance.py \
            --manifest target/release-assets/msc2-update-manifest.json

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: MSC 2 ${{ github.ref_name }}
          prerelease: true
          draft: false
          generate_release_notes: false
          body_path: target/release-assets/RELEASE-NOTES.md
          fail_on_unmatched_files: true
          files: target/release-assets/*
