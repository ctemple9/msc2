[package]
name = "msc2-desktop-web"
version = "0.1.0"
description = "Thin Tauri shell for the shared MSC 2 client"
authors = ["Cameron Temple"]
edition = "2021"

[lib]
name = "msc2_desktop_web_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
msc-infrastructure = { path = "../../../crates/msc-infrastructure" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
msc-platform-macos = { path = "../../../crates/msc-platform-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
msc-platform-windows = { path = "../../../crates/msc-platform-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
msc-platform-linux = { path = "../../../crates/msc-platform-linux" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
