[package]
name = "msc2-desktop-web"
version = "0.1.30"
description = "Thin Tauri shell for the shared MSC 2 client"
authors = ["Cameron Temple"]
edition = "2021"

[lib]
name = "msc2_desktop_web_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
msc-infrastructure = { path = "../../../crates/msc-infrastructure" }
msc-api = { path = "../../../crates/msc-api" }
msc-application = { path = "../../../crates/msc-application" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
tokio = { version = "1", features = ["rt", "fs", "io-util", "sync", "time", "macros", "net"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
msc-platform-macos = { path = "../../../crates/msc-platform-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
msc-platform-windows = { path = "../../../crates/msc-platform-windows" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
msc-platform-linux = { path = "../../../crates/msc-platform-linux" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]

[profile.dev.package.sha2]
opt-level = 3
