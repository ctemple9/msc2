[package]
name = "msc-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "msc-agent"
path = "src/main.rs"

[dependencies]
msc-api = { path = "../msc-api" }
msc-application = { path = "../msc-application" }
msc-domain = { path = "../msc-domain" }
msc-infrastructure = { path = "../msc-infrastructure" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
sha1 = "0.10"
subtle = "2.6"
