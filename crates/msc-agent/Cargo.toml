[package]
name = "msc-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "msc-agent"
path = "src/main.rs"

[dependencies]
msc-api = { path = "../msc-api" }
msc-domain = { path = "../msc-domain" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
