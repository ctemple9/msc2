[package]
name = "msc-agent"
version = "0.1.0"
edition = "2024"

[features]
default = ["web-ui"]
# A headless distribution can opt out of the optional browser bundle without
# acquiring a GUI or browser-engine dependency.
web-ui = []

[[bin]]
name = "msc"
path = "src/main.rs"

[dependencies]
msc-api = { path = "../msc-api" }
msc-application = { path = "../msc-application" }
msc-domain = { path = "../msc-domain" }
msc-infrastructure = { path = "../msc-infrastructure" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "signal"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
uuid = { version = "1.24.0", features = ["v4"] }
include_dir = "0.7"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
msc-platform-macos = { path = "../msc-platform-macos" }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
msc-platform-linux = { path = "../msc-platform-linux" }

[target.'cfg(target_os = "windows")'.dependencies]
msc-platform-windows = { path = "../msc-platform-windows" }
