[package]
name = "msc-application"
version = "0.1.0"
edition = "2024"

[dependencies]
msc-domain = { path = "../msc-domain" }
msc-infrastructure = { path = "../msc-infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

sha2 = "0.10"
sha1 = "0.10"
fs2 = "0.4"

[dev-dependencies]
flate2 = "1"
