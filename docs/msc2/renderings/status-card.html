<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSC 2 — locked status card</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>body{margin:0;background:#050506;padding:32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}</style>
</head>
<body>
<!-- LOCKED S0 REFERENCE — the disciplined status card. Governed by docs/msc2/antiAIslop.md.
     No side rail, neutral icon, borderless (separated by tier contrast #1C1C21 on #0D0D0F),
     status carried ONLY by the dot + colored label, one whisper shadow. -->
<div style="background:#0D0D0F;border-radius:14px;padding:22px;max-width:520px;">
  <div style="font-size:10px;font-weight:600;letter-spacing:0.8px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:12px;">Server health</div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;">

    <div style="background:#1C1C21;border-radius:12px;padding:15px 16px;box-shadow:0 1px 2px rgba(0,0,0,0.3);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;"><i class="ti ti-puzzle" style="font-size:17px;color:rgba(255,255,255,0.45);" aria-hidden="true"></i><span style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.95);">Components</span></div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span style="width:7px;height:7px;border-radius:50%;background:#4DC778;display:inline-block;"></span><span style="font-size:12px;color:#4DC778;font-weight:500;">OK</span></div>
      <div style="font-size:12px;color:rgba(255,255,255,0.5);">1 component — up to date</div>
    </div>

    <div style="background:#1C1C21;border-radius:12px;padding:15px 16px;box-shadow:0 1px 2px rgba(0,0,0,0.3);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px;"><i class="ti ti-world" style="font-size:17px;color:rgba(255,255,255,0.45);" aria-hidden="true"></i><span style="font-size:14px;font-weight:500;color:rgba(255,255,255,0.95);">Port</span></div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;"><span style="width:7px;height:7px;border-radius:50%;background:#FF9140;display:inline-block;"></span><span style="font-size:12px;color:#FF9140;font-weight:500;">Warn</span></div>
      <div style="font-size:12px;color:rgba(255,255,255,0.5);">Port 25565 (TCP)</div>
    </div>

  </div>
</div>
</body>
</html>
