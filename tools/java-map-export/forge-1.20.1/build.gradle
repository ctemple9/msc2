plugins { id 'net.minecraftforge.gradle' version '6.0.54' }
version = '0.1.0'
group = 'dev.msc.mapexport'
base { archivesName = 'msc-forge-map-capture-fixture' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
def workspace = providers.gradleProperty('captureWorkspace').getOrElse(System.getProperty('user.home') + '/.cache/msc-map-forge-capture')
minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            workingDirectory file(workspace + '/client')
            property 'msc.export.workspace', workspace
            mods { msc_mesh_capture_fixture { source sourceSets.main } }
        }
    }
}
repositories { flatDir { dirs file(workspace + '/mods') } }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    runtimeOnly fg.deobf('fixture:supplementaries:1.20-3.1.43-forge')
    runtimeOnly fg.deobf('fixture:moonlight:1.20-2.16.35-forge')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.named('jar').configure { finalizedBy 'reobfJar' }
