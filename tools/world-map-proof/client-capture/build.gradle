plugins { id 'net.neoforged.moddev' version '2.0.141' }
version = '0.1.0'
group = 'dev.msc.mapproof'
base { archivesName = 'msc-client-mesh-proof' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
def proofWorkspace = providers.gradleProperty('proofWorkspace').getOrElse(System.getProperty('user.home') + '/.cache/msc-map-client-proof')
neoForge {
    version = '21.1.251'
    accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))
    runs {
        client {
            client()
            gameDirectory = file(proofWorkspace + '/client')
            systemProperty 'msc.proof.workspace', proofWorkspace
        }
    }
    mods { msc_mesh_capture_proof { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }

// Inspect the actual launch task without executing its Java process.
tasks.register('writeProofLaunchReceipt') {
    dependsOn 'prepareClientRun'
    doLast {
        def runTask = tasks.named('runClient').get()
        def gameDir = runTask.gameDirectory.get().asFile.canonicalFile
        if (gameDir != file(proofWorkspace + '/client').canonicalFile) {
            throw new GradleException('Refused launch directory outside the isolated client')
        }
        def receipt = [minecraft: '1.21.1', neoforge: '21.1.251', javaExecutable: runTask.javaLauncher.get().executablePath.asFile.toString(),
                       gameDirectory: gameDir.toString(), launchPrepared: true, gameLaunched: false]
        file(proofWorkspace + '/launch-receipt.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(receipt))
    }
}
